# 溪语 AI · bot.log 轮转配置（v1.21.4）
# 背景：logger.mjs 用 createWriteStream(append) 持有 fd 写 logs/bot.log，
#       无内置轮转——不接 logrotate 会无限增长（生产实测 9 天涨到 31MB）。
#       且 bot.log 含公网 IP（隐私政策"运行日志定期轮转清理"的承诺靠它兑现）。
# 关键：必须 copytruncate——app 持有 fd，rename 会导致继续写旧文件。
#
# 安装（生产）：
#   sudo cp scripts/logrotate-xiyu.conf /etc/logrotate.d/xiyu-ai
#   # 把下方路径改成你的实际部署路径
#   sudo logrotate -d /etc/logrotate.d/xiyu-ai   # dry-run 验证
#
# 自托管者：把 /opt/xiyu-ai-new 改成你的部署目录。
/opt/xiyu-ai-new/logs/bot.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
